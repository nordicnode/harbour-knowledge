services:
  postgres:
    image: vxcontrol/pgvector:latest
    container_name: kb-postgres
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb_dev_password
      POSTGRES_DB: kb
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kb-pgdata:
