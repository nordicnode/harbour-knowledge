[project]
name = "harbour-knowledge-api"
version = "0.1.0"
description = "Governed support knowledge base API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "openai>=1.54",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=4.1",
    "torch>=2.6",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "fpdf2>=2.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
